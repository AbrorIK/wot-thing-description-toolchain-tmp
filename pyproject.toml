[project]
name = "wotis"
version = "0.1.0"
description = "The CLI tool for Web of Things Integrated Schemas (WOTIS)"
authors = [
    { name = "Mahda Noura", email = "mahda.noura@siemens.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Pinned to an exact commit so every install generates identical output.
    # Not a release pin yet: linkml 1.12.1 emits different SHACL (href as sh:IRI, but the TD
    # context types it xsd:anyURI) and drops OWL annotation-property declarations. Switch to
    # linkml==x.y.z once a release regenerates resources/gens/ without differences.
    "linkml @ git+https://github.com/linkml/linkml.git@7fc43e440d18df29643f78dafd59fa066c54edd2#subdirectory=packages/linkml",
    # Same commit: linkml only asks for linkml-runtime>=1.12.0, so pip would otherwise take the PyPI release.
    "linkml-runtime @ git+https://github.com/linkml/linkml.git@7fc43e440d18df29643f78dafd59fa066c54edd2#subdirectory=packages/linkml_runtime",
    "jsonschema>=4.21.1",
    "lxml>=6.1.0",
    "cssselect>=1.4.0",
    "bikeshed>=7.0.11",
    "click>=8.1.7",
    "jsonfold>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Installs the code as the top-level package `wotis` (not `src.wotis`).
packages = ["src/wotis"]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
wotis = "wotis.cli:main"

# Where wotis reads its inputs and writes generated files in this repository.
# Paths are relative to this file. Other repositories that use wotis add their own table.
[tool.wotis]
schema = "resources/schemas/thing_description.yaml"
template = "resources/index.template.html"
snippets = "resources/snippets"
glossary = "resources/xref/glossary.yaml"
static_figures = "resources/static/visualization"
extra_asserts = "resources/upstream/extra-asserts.html"
tm_schema = "resources/upstream/schemas/tm-json-schema-validation.json"

# Spec section id -> LinkML schema whose classes are rendered into it, in spec order.
[tool.wotis.sections]
sec-core-vocabulary-definition = "resources/schemas/thing_description.yaml"
sec-data-schema-vocabulary-definition = "resources/schemas/jsonschema.yaml"
sec-security-vocabulary-definition = "resources/schemas/wot_security.yaml"
sec-hypermedia-vocabulary-definition = "resources/schemas/hypermedia.yaml"

[tool.wotis.outputs]
jsonschema = "resources/gens/jsonschema/jsonschema.json"
context = "resources/gens/jsonldcontext/context.jsonld"
shacl = "resources/gens/shacl/shapes.shacl.ttl"
owl = "resources/gens/owl/ontology.owl.ttl"
linkml = "resources/gens/linkml/linkml.yaml"
diagrams = "resources/gens/static/visualization"
spec = "resources/gens/index.html"
assertions = "resources/gens/assertions/assertions.csv"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
